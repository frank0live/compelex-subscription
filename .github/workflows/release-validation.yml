# The release validation, on Linux, exactly as the release checklist names it.
#
# WHY THIS EXISTS. `npm test` is the evidence behind "Supported": it renders the
# shipped shells on the REAL template engines -- PasarGuard's Jinja2 and
# Rebecca's pongo2 -- rather than on a stand-in. That makes the suite depend on
# three tools the Node runtime alone does not provide:
#
#   Go              tools/fixtures (the fixture renderer) and
#                   tools/engines/pongo2 (Rebecca's engine, v6.1.0, the version
#                   Rebecca pins) are both built from source
#   Python 3 +      tools/engines/jinja2_pasarguard.py renders the PasarGuard
#   Jinja2          shells with the real Jinja2
#   ShellCheck      npm run lint:sh gates the installer and the release tooling
#
# A developer's machine may have all three; a fresh checkout may not. The point
# of running here is that "the suite passes" stops depending on whose machine it
# ran on, and that the four commands below are the same four the release
# checklist names, in the same order, failing on the first one that does not
# pass.
#
# NOT the Docs workflow. That one builds and publishes docs/ and never runs the
# suite; a green "build" check on a pull request says nothing about this.

name: Release validation

on:
  pull_request:
    paths:
      - "src/**"
      - "tools/**"
      - "tests/**"
      - "installer/**"
      - "template/**"
      - "package.json"
      - "VERSION"
      - ".github/workflows/release-validation.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # No `cache: npm`: this project has no dependencies and no lockfile, so
      # the cache step would have nothing to hash and would fail.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install the test toolchain (Python 3 + Jinja2, ShellCheck)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-jinja2 shellcheck

      - name: Show the toolchain
        run: |
          node --version
          go version
          python3 -c 'import jinja2; print("jinja2", jinja2.__version__)'
          shellcheck --version

      # `npm test` runs `pretest` (the fixture renderer) first, which needs Go.
      - name: npm test
        run: npm test

      - name: npm run verify
        run: npm run verify

      - name: npm run lint:sh
        run: npm run lint:sh

      - name: npm run build:panels
        run: npm run build:panels
